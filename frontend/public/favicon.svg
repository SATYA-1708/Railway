<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Badge Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b56a0" />
      <stop offset="50%" stop-color="#154684" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>

    <!-- Train Body Gradient -->
    <linearGradient id="locoBodyGrad" x1="64" y1="20" x2="64" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f0f6fc" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Windshield Gradient -->
    <linearGradient id="windshieldGrad" x1="64" y1="30" x2="64" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f2342" />
      <stop offset="60%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#050e1c" />
    </linearGradient>

    <!-- Windshield Glare -->
    <linearGradient id="glareGrad" x1="44" y1="36" x2="60" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Saffron Speed Stripe -->
    <linearGradient id="saffronGrad" x1="35" y1="64" x2="93" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff9933" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Headlight Radial Glow -->
    <radialGradient id="headlightGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </radialGradient>

    <!-- Left Track Gradient -->
    <linearGradient id="trackSteelL" x1="16" y1="118" x2="55" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c7dbf1" />
    </linearGradient>

    <!-- Right Track Gradient -->
    <linearGradient id="trackSteelR" x1="112" y1="118" x2="73" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c7dbf1" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background Badge -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2" />

  <!-- Railway Group Scaled & Centered -->
  <g transform="translate(4, 3)">
    <!-- Converging Steel Tracks -->
    <path d="M15 112 L48 68 L53 68 L30 112" fill="url(#trackSteelL)" opacity="0.9" />
    <path d="M105 112 L72 68 L67 68 L90 112" fill="url(#trackSteelR)" opacity="0.9" />
    <line x1="22" y1="106" x2="98" y2="106" stroke="#475569" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
    <line x1="30" y1="94" x2="90" y2="94" stroke="#475569" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <line x1="38" y1="82" x2="82" y2="82" stroke="#475569" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

    <!-- Pantograph Roof Gear -->
    <path d="M50 15 L55 23 L65 23 L70 15" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
    <line x1="47" y1="15" x2="73" y2="15" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" />

    <!-- Main Aerodynamic Locomotive Body -->
    <path
      d="M60 19 C43 19 35 29 34 50 L31 84 C31 89 35 93 42 93 L78 93 C85 93 89 89 89 84 L86 50 C85 29 77 19 60 19 Z"
      fill="url(#locoBodyGrad)"
      stroke="#ffffff"
      stroke-width="1.8"
    />

    <!-- Aerodynamic Fluted Side Panels -->
    <path d="M34 52 L32 84 L37 86 L39 52 Z" fill="#0f2342" opacity="0.75" />
    <path d="M86 52 L88 84 L83 86 L81 52 Z" fill="#0a192f" opacity="0.85" />

    <!-- Dark Tinted Panoramic Windscreen -->
    <path
      d="M37 42 C39 33 48 28 60 28 C72 28 81 33 83 42 L82 54 C76 56 68 57 60 57 C52 57 44 56 38 54 Z"
      fill="url(#windshieldGrad)"
      stroke="#38bdf8"
      stroke-width="1.4"
    />

    <!-- Windscreen Glare -->
    <path
      d="M41 36 C47 31 54 30 60 30 L56 52 C50 52 44 51 41 49 Z"
      fill="url(#glareGrad)"
    />

    <!-- Saffron & Cyan Speed Stripes -->
    <path d="M32 62 L88 62 L87 68 L33 68 Z" fill="url(#saffronGrad)" />
    <path d="M32.5 69 L87.5 69 L87 73 L33 73 Z" fill="#00d2ff" />

    <!-- Cattle Guard / Cowcatcher Deflector -->
    <path
      d="M37 86 L83 86 L77 96 L43 96 Z"
      fill="#0a192f"
      stroke="#1b56a0"
      stroke-width="1.8"
    />
    <line x1="52" y1="87" x2="50" y2="95" stroke="#94a3b8" stroke-width="1.8" />
    <line x1="60" y1="87" x2="60" y2="95" stroke="#94a3b8" stroke-width="1.8" />
    <line x1="68" y1="87" x2="70" y2="95" stroke="#94a3b8" stroke-width="1.8" />

    <!-- Dual Projector Headlights with Glow -->
    <circle cx="43" cy="79" r="6" fill="#fef08a" fill-opacity="0.4" />
    <circle cx="43" cy="79" r="4.2" fill="url(#headlightGrad)" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="43" cy="79" r="2" fill="#ffffff" />
    <circle cx="41.5" cy="77.5" r="0.9" fill="#ffffff" />

    <circle cx="77" cy="79" r="6" fill="#fef08a" fill-opacity="0.4" />
    <circle cx="77" cy="79" r="4.2" fill="url(#headlightGrad)" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="77" cy="79" r="2" fill="#ffffff" />
    <circle cx="75.5" cy="77.5" r="0.9" fill="#ffffff" />

    <!-- Top Spotlight -->
    <circle cx="60" cy="25" r="4" fill="#38bdf8" fill-opacity="0.6" />
    <circle cx="60" cy="25" r="2.8" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
    <circle cx="60" cy="25" r="1.3" fill="#e0f2fe" />
  </g>
</svg>